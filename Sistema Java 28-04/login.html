<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Funcionários</title>
    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <i class='bx bxs-user-circle'></i>
            </div>
            
            <h2 id="form-title">Entrar</h2>
            <p class="form-subtitle" id="form-subtitle">Faça login para acessar o sistema</p>
            
            <!-- Formulário de Login -->
            <form id="login-form">
                <div class="input-group">
                    <i class='bx bxs-user'></i>
                    <input type="text" id="username" placeholder="Usuário" required>
                </div>
                <div class="input-group">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="password" id="password" placeholder="Senha" required>
                </div>
                <div class="remember-me">
                    <label>
                        <input type="checkbox" id="remember"> Lembrar-me
                    </label>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="register-form" style="display: none;">
                <div class="input-group">
                    <i class='bx bxs-user'></i>
                    <input type="text" id="reg-username" placeholder="Novo usuário" required>
                </div>
                <div class="input-group">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="password" id="reg-password" placeholder="Nova senha" required>
                </div>
                <div class="input-group">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="password" id="reg-confirm-password" placeholder="Confirmar senha" required>
                </div>
                <button type="submit" class="btn-login">Cadastrar</button>
            </form>

            <div class="toggle-form">
                <span id="toggle-text">Não tem conta? <a href="#" id="toggle-link">Cadastre-se</a></span>
            </div>
            
            <div class="error-message" id="error-message"></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
